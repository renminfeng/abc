<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>蓝星寻呼 1999</title>
  <style>
    /* Styles ported from App.tsx */
    * { box-sizing: border-box; }
    body { margin: 0; }
    button,input,textarea { font-family: Tahoma, "Microsoft YaHei", sans-serif; }
    .page { min-height:100vh; padding:18px; color:#123; font-family: Tahoma, "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 20px 20px, rgba(255,255,255,.2) 2px, transparent 2px), linear-gradient(135deg,#0d63a8,#063b70 55%,#082c5f); background-size:20px 20px,auto; overflow:hidden; }
    .app-window { height: calc(100vh - 36px); display:flex; flex-direction:column; overflow:hidden; border:4px solid #072e63; border-radius:10px; background:#c9ddfb; box-shadow:10px 10px 0 rgba(0,0,0,.35); }
    .titlebar { height:44px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; padding:0 12px; color:#fff; font-weight:700; letter-spacing:.5px; border-bottom:2px solid #062451; background: linear-gradient(to right,#0b4da5,#2d7bd5,#b7d8ff); }
    .title-left { display:flex; align-items:center; gap:10px; }
    .logo{ width:18px; height:18px; position:relative; overflow:hidden; border-radius:4px; background:#fff; }
    .logo::before{ content:""; position:absolute; inset:3px; border-radius:50%; background:#1b75d0; }
    .window-buttons{ display:flex; gap:4px; }
    .window-button{ width:28px; height:22px; cursor:pointer; color:#072c5d; font-weight:700; border:1px solid #0a2b63; background:linear-gradient(to bottom,#fff,#a9ccf6); box-shadow: inset 1px 1px 0 rgba(255,255,255,.8); }
    .main{ flex:1; display:grid; grid-template-columns:300px minmax(0,1fr) 260px; min-height:0; overflow:hidden; }
    .sidebar, .rightbar { min-height:0; overflow:auto; background:#dbeaff; }
    .sidebar{ border-right:2px solid #0a3774; }
    .rightbar{ border-left:2px solid #0a3774; }
    .profile { margin:14px; padding:12px; border:2px solid #0a3774; background: linear-gradient(to bottom,#fff,#d8e9ff); box-shadow: inset 2px 2px 0 rgba(255,255,255,.8); }
    .profile-top{ display:flex; align-items:center; gap:12px; }
    .avatar{ width:42px; height:42px; position:relative; flex-shrink:0; overflow:hidden; border:2px solid #205896; border-radius:10px; box-shadow: inset 2px 2px 0 rgba(255,255,255,.9), inset -2px -2px 0 rgba(0,0,0,.15), 3px 3px 0 rgba(0,0,0,.2); }
    .avatar-large{ width:62px; height:62px; border-color:#184f90; border-radius:14px; }
    .avatar-face{ position:absolute; left:50%; top:7px; width:24px; height:20px; transform:translateX(-50%); border-radius:50%; background: rgba(255,255,255,.85); }
    .avatar-large .avatar-face{ top:10px; width:36px; height:30px; }
    .avatar-eye{ position:absolute; top:16px; width:4px; height:4px; border-radius:50%; background:#111; }
    .avatar-large .avatar-eye{ top:24px; width:5px; height:5px; }
    .avatar-eye-left{ left:13px; }
    .avatar-eye-right{ right:13px; }
    .avatar-large .avatar-eye-left{ left:18px; }
    .avatar-large .avatar-eye-right{ right:18px; }
    .avatar-mouth{ position:absolute; left:50%; top:23px; width:12px; height:7px; transform:translateX(-50%); border:1px solid #9a5200; border-radius:0 0 8px 8px; background:orange; }
    .avatar-large .avatar-mouth{ top:33px; width:18px; height:10px; border-radius:0 0 10px 10px; }
    .avatar-foot{ position:absolute; bottom:6px; width:11px; height:7px; border:1px solid #9a5200; border-radius:10px; background:#ffb347; }
    .avatar-large .avatar-foot{ bottom:9px; width:16px; height:10px; }
    .avatar-foot-left{ left:7px; }
    .avatar-foot-right{ right:7px; }
    .avatar-large .avatar-foot-left{ left:10px; }
    .avatar-large .avatar-foot-right{ right:10px; }
    .status-dot{ width:10px; height:10px; display:inline-block; margin-left:6px; border:1px solid #0a5724; border-radius:50%; }
    .nickname{ display:flex; align-items:center; color:#05316b; font-size:18px; font-weight:700; }
    .signature{ margin-top:6px; padding:5px 8px; border-radius:4px; color:#4a5568; font-size:12px; background:#fff; }
    .quick-buttons{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
    .quick-buttons button, .toolbar-button, .send-button{ cursor:pointer; border:1px solid #0a3774; background:#fff; box-shadow: inset 1px 1px 0 rgba(255,255,255,.8); }
    .quick-buttons button{ padding:5px; font-size:12px; }
    .search-box{ display:flex; align-items:center; gap:8px; margin:0 14px 14px; padding:8px; border:2px solid #0a3774; background:#fff; box-shadow: inset 1px 1px 3px rgba(0,0,0,.2); }
    .search-box input{ width:100%; border:0; outline:0; font-size:13px; }
    .section-title{ padding:10px 14px; color:#07346f; font-weight:700; border-top:2px solid #0a3774; border-bottom:2px solid #0a3774; background: linear-gradient(to right,#bdd9ff,#fff); }
    .friends{ padding:10px; }
    .friend{ display:flex; align-items:center; gap:10px; width:100%; margin-bottom:6px; padding:8px; text-align:left; cursor:pointer; border:1px solid transparent; border-radius:6px; background:transparent; }
    .friend:hover, .friend.active{ border-color:#0b4da5; background:#fff7cb; }
    .friend-info{ flex:1; min-width:0; }
    .friend-title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .friend-name{ color:#072d61; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .friend-sign{ margin-top:3px; color:#5b6572; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .unread{ min-width:18px; height:18px; padding:0 5px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; border-radius:999px; background:#e03131; }
    .chat-area{ display:flex; flex-direction:column; min-width:0; min-height:0; background:#eef6ff; }
    .chat-header{ display:flex; align-items:center; justify-content:space-between; flex-shrink:0; padding:12px 16px; border-bottom:2px solid #0a3774; background: linear-gradient(to bottom,#fff,#c6defc); }
    .chat-user{ display:flex; align-items:center; gap:12px; min-width:0; }
    .chat-actions{ display:flex; gap:4px; }
    .chat-box{ flex:1; min-height:0; overflow:auto; padding:20px; background-image: linear-gradient(rgba(12,84,155,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(12,84,155,.05) 1px, transparent 1px); background-size:18px 18px; }
    .message{ display:flex; align-items:flex-start; gap:10px; margin-bottom:16px; }
    .message.me{ justify-content:flex-end; }
    .bubble{ max-width:70%; }
    .message.me .bubble{ text-align:right; }
    .time{ margin-bottom:4px; color:#6b7280; font-size:11px; }
    .bubble-content{ padding:10px 14px; line-height:1.6; border:2px solid #525252; border-radius:12px; background:#fffde8; box-shadow:3px 3px 0 rgba(0,0,0,.15); word-break:break-word; }
    .message.me .bubble-content{ border-color:#165ea8; background:#d8edff; }
    .toolbar{ flex-shrink:0; padding:10px 12px; border-top:2px solid #0a3774; background:#dbeaff; }
    .toolbar-top{ display:flex; gap:8px; margin-bottom:10px; }
    .toolbar-button{ width:32px; height:32px; font-size:16px; }
    .editor{ display:flex; gap:10px; }
    .editor textarea{ flex:1; height:90px; padding:10px; resize:none; outline:0; border:2px solid #0a3774; font-size:14px; box-shadow: inset 2px 2px 3px rgba(0,0,0,.15); }
    .send-button{ width:110px; color:#072d61; font-size:15px; font-weight:700; background: linear-gradient(to bottom,#fff9c8,#ffc85d); }
    .card{ margin:14px; padding:14px; border:2px solid #0a3774; background:#fff; }
    .card-yellow{ background:#fffde8; }
    .card-avatar-wrap{ display:flex; justify-content:center; margin-bottom:12px; }
    .card h3{ margin:0 0 10px; color:#07346f; font-size:15px; }
    .card p, .card li{ color:#445; font-size:13px; line-height:1.7; }
    .card ul{ margin:0; padding-left:18px; }
    @media (max-width:1100px){ .main{ grid-template-columns:260px minmax(0,1fr); } .rightbar{ display:none; } }
    @media (max-width:760px){ .page{ padding:0; } .app-window{ height:100vh; border-radius:0; } .main{ grid-template-columns: minmax(0,1fr); } .sidebar{ display:none; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="app-window">
      <div class="titlebar">
        <div class="title-left">
          <div class="logo"></div>
          <div>蓝星寻呼 1999</div>
        </div>
        <div class="window-buttons">
          <button class="window-button" data-action="min">—</button>
          <button class="window-button" data-action="max">□</button>
          <button class="window-button" data-action="close">×</button>
        </div>
      </div>

      <div class="main">
        <aside class="sidebar">
          <div class="profile">
            <div class="profile-top">
              <div class="avatar avatar-large" id="profileAvatar"></div>
              <div>
                <div class="nickname">rosermf <span id="profileStatus" class="status-dot" style="background:#25d65a"></span></div>
                <div class="signature">早期互联网模式已开启</div>
              </div>
            </div>
            <div class="quick-buttons">
              <button>资料</button>
              <button>空间</button>
              <button>邮箱</button>
              <button>设置</button>
            </div>
          </div>

          <div class="search-box">
            <span>🔍</span>
            <input id="searchInput" type="text" placeholder="查找好友 / 昵称 / 备注" />
          </div>

          <div class="section-title">好友列表</div>
          <div class="friends" id="friendsList"></div>
        </aside>

        <section class="chat-area">
          <div class="chat-header">
            <div class="chat-user">
              <div class="avatar" id="chatAvatar"></div>
              <div>
                <div class="friend-name" id="chatName">小海豚</div>
                <div class="friend-sign" id="chatMood">今天也要认真冲浪</div>
              </div>
            </div>
            <div class="chat-actions">
              <button class="window-button">☆</button>
              <button class="window-button">⚙</button>
            </div>
          </div>

          <div class="chat-box" id="chatBox"></div>

          <div class="toolbar">
            <div class="toolbar-top">
              <button class="toolbar-button">☺</button>
              <button class="toolbar-button">📎</button>
              <button class="toolbar-button">★</button>
            </div>
            <div class="editor">
              <textarea id="editor" placeholder="输入消息……"></textarea>
              <button class="send-button" id="sendBtn">发送</button>
            </div>
          </div>
        </section>

        <aside class="rightbar">
          <div class="section-title">好友资料卡</div>
          <div class="card">
            <div class="card-avatar-wrap"><div class="avatar avatar-large" id="cardAvatar"></div></div>
            <h3 id="cardName">小海豚</h3>
            <p id="cardId">ID：19991188</p>
            <p id="cardSign">拨号上线中……</p>
          </div>
          <div class="card card-yellow">
            <h3>设计说明</h3>
            <p>整体采用 1999 年左右即时通讯风格：蓝白灰窗口、厚边框、像素感头像、好友列表、聊天气泡与老式系统按钮。</p>
          </div>
          <div class="card">
            <h3>平台模块</h3>
            <ul>
              <li>好友列表</li>
              <li>聊天窗口</li>
              <li>搜索好友</li>
              <li>发送提示音</li>
              <li>资料卡系统</li>
              <li>复古原创头像</li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    // Data copied/ported from App.tsx
    const friends = [
      { id:1, name:"小海豚", sign:"拨号上线中……", mood:"今天也要认真冲浪", status:"online", color:"linear-gradient(135deg,#e5f2ff,#8abfff,#bccce4)", unread:2, messages:[{from:'them',text:'你上线啦？刚刚群里很热闹。',time:'20:11'},{from:'me',text:'在，正在把聊天平台界面做得复古一点。',time:'20:12'},{from:'them',text:'头像要像 99 年那种小图标，别太现代。',time:'20:13'}] },
      { id:2, name:"南方网友", sign:"OICQ 老友记", mood:"离开一会儿，稍后回来", status:"away", color:"linear-gradient(135deg,#fff2c7,#ffbf6f,#ff8c42)", unread:0, messages:[{from:'them',text:'这个窗口边框要厚一点，像老系统。',time:'19:48'},{from:'me',text:'收到，还会加状态灯、好友列表、聊天气泡。',time:'19:50'}] },
      { id:3, name:"像素猫", sign:"别戳我头像", mood:"喵喵喵，正在聊天室潜水", status:"online", color:"linear-gradient(135deg,#ffe2ff,#b687ff,#7263ff)", unread:5, messages:[{from:'them',text:'给头像加一点像素锯齿感。',time:'18:05'},{from:'them',text:'不要太真实，要像早期互联网。',time:'18:06'}] },
      { id:4, name:"风铃同学", sign:"聊天室见", mood:"忙碌，稍后回", status:"busy", color:"linear-gradient(135deg,#ffe4ec,#ff9ab3,#ff6580)", unread:0, messages:[{from:'them',text:'可以做一个右侧个人资料卡。',time:'17:22'},{from:'me',text:'已经安排，保留老派蓝白灰配色。',time:'17:24'}] },
      { id:5, name:"电子雪糕", sign:"欢迎访问我的主页", mood:"离线留言", status:"offline", color:"linear-gradient(135deg,#e1fff5,#7de2c3,#59b5ff)", unread:0, messages:[{from:'them',text:'记得做一个留言板感觉。',time:'昨天'}] }
    ];

    function getTime(){ const now=new Date(); const h=String(now.getHours()).padStart(2,'0'); const m=String(now.getMinutes()).padStart(2,'0'); return h+':'+m; }
    function playBeep(){ try{ const AudioCtx=window.AudioContext||window.webkitAudioContext; if(!AudioCtx) return; const ctx=new AudioCtx(); const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type='square'; osc.frequency.setValueAtTime(680,ctx.currentTime); gain.gain.setValueAtTime(0.05,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+0.08); }catch(e){} }

    // Simple state (vanilla JS)
    let activeId = 1;
    let messageMap = {}; friends.forEach(f=>{ messageMap[f.id] = f.messages.slice(); });

    const friendsListEl = document.getElementById('friendsList');
    const searchInput = document.getElementById('searchInput');
    const chatBox = document.getElementById('chatBox');
    const chatName = document.getElementById('chatName');
    const chatMood = document.getElementById('chatMood');
    const chatAvatar = document.getElementById('chatAvatar');
    const cardAvatar = document.getElementById('cardAvatar');
    const cardName = document.getElementById('cardName');
    const cardId = document.getElementById('cardId');
    const cardSign = document.getElementById('cardSign');
    const profileAvatar = document.getElementById('profileAvatar');
    const editor = document.getElementById('editor');
    const sendBtn = document.getElementById('sendBtn');

    function setBackgroundOnAvatar(el, color){ if(!el) return; el.style.background = color; }

    function renderFriends(filter=''){
      friendsListEl.innerHTML = '';
      const kw = filter.trim().toLowerCase();
      const list = friends.filter(f => (f.name + ' ' + f.sign + ' ' + f.mood).toLowerCase().includes(kw));
      list.forEach(f => {
        const btn = document.createElement('button'); btn.className = 'friend' + (f.id===activeId? ' active':'');
        btn.onclick = ()=>{ activeId = f.id; renderAll(); };
        const av = document.createElement('div'); av.className = 'avatar'; setBackgroundOnAvatar(av,f.color);
        const info = document.createElement('div'); info.className = 'friend-info';
        const titleRow = document.createElement('div'); titleRow.className = 'friend-title-row';
        const name = document.createElement('div'); name.className = 'friend-name'; name.textContent = f.name;
        const status = document.createElement('span'); status.className = 'status-dot'; status.style.background = statusColor(f.status);
        const unread = (f.unread>0)? (()=>{ const s=document.createElement('span'); s.className='unread'; s.textContent = String(f.unread); return s; })() : null;
        const sign = document.createElement('div'); sign.className = 'friend-sign'; sign.textContent = f.sign;
        titleRow.appendChild(name); titleRow.appendChild(status); if(unread) titleRow.appendChild(unread);
        info.appendChild(titleRow); info.appendChild(sign);
        btn.appendChild(av); btn.appendChild(info);
        friendsListEl.appendChild(btn);
      });
    }

    function statusColor(s){ return ({online:'#25d65a',away:'#ffd84d',busy:'#f05252',offline:'#b7c0cd'})[s] || '#b7c0cd'; }

    function renderChat(){
      const friend = friends.find(f=>f.id===activeId) || friends[0];
      chatName.textContent = friend.name; chatMood.textContent = friend.mood; setBackgroundOnAvatar(chatAvatar, friend.color); setBackgroundOnAvatar(cardAvatar, friend.color); setBackgroundOnAvatar(profileAvatar, 'linear-gradient(135deg,#dff0ff,#7bb4ff,#bfcfe4)');
      cardName.textContent = friend.name; cardId.textContent = 'ID：1999' + friend.id + '88'; cardSign.textContent = friend.sign;
      chatBox.innerHTML = '';
      const msgs = messageMap[friend.id] || [];
      msgs.forEach((m, idx) => {
        const wrap = document.createElement('div'); wrap.className = 'message' + (m.from==='me'?' me':'');
        if(m.from!=='me'){ const av=document.createElement('div'); av.className='avatar'; setBackgroundOnAvatar(av,friend.color); wrap.appendChild(av); }
        const bubble = document.createElement('div'); bubble.className='bubble';
        const time = document.createElement('div'); time.className='time'; time.textContent = m.time;
        const content = document.createElement('div'); content.className='bubble-content'; content.textContent = m.text;
        bubble.appendChild(time); bubble.appendChild(content);
        wrap.appendChild(bubble);
        if(m.from==='me'){ const av=document.createElement('div'); av.className='avatar'; setBackgroundOnAvatar(av,'linear-gradient(135deg,#dff0ff,#7bb4ff,#bfcfe4)'); wrap.appendChild(av); }
        chatBox.appendChild(wrap);
      });
      // scroll to bottom
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderAll(){ renderFriends(searchInput.value||''); renderChat(); }

    sendBtn.addEventListener('click', ()=>{ sendMessage(); });
    editor.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
    searchInput.addEventListener('input', ()=>{ renderAll(); });

    function sendMessage(){ const text = editor.value.trim(); if(!text) return; playBeep(); const t = getTime(); if(!messageMap[activeId]) messageMap[activeId]=[]; messageMap[activeId].push({ from:'me', text, time: t }); editor.value = ''; renderChat(); }

    // initial render
    renderAll();

    // attach simple hover/active styles via delegation for friend buttons (keep unread unchanged)
    // noop for window control buttons
  </script>
</body>
</html>
