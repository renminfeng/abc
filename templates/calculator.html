<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python 网页计算器</title>
    <style>
        :root { font-family: Arial, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #dbeafe, #f5f3ff);
        }
        .card {
            width: min(92vw, 460px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,.12);
            padding: 24px;
        }
        h1 { margin-top: 0; font-size: 1.4rem; }
        p.hint { color: #4b5563; margin-top: 4px; }
        input[type="text"] {
            width: 100%;
            font-size: 1.1rem;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            box-sizing: border-box;
        }
        button {
            margin-top: 12px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
        }
        .result { margin-top: 14px; font-weight: bold; color: #047857; }
        .error { margin-top: 14px; font-weight: bold; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Python 网页计算器</h1>
        <p class="hint">支持 + - * / % ** 和括号，如： (2+3)*4 / 5</p>

        <form method="post">
            <label for="expression">请输入表达式：</label>
            <input id="expression" type="text" name="expression" value="{{ expression }}" placeholder="例如：1 + 2 * (3 - 1)" required>
            <button type="submit">计算</button>
        </form>

        {% if result is not none %}
        <div class="result">结果：{{ result }}</div>
        {% endif %}

        {% if error %}
        <div class="error">错误：{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
